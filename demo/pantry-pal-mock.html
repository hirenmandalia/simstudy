<!doctype html>
<!--
  Fictional "Pantry Pal" recipe app used as demo-safe test input.
  Every name, recipe and number is invented. No real app, brand or person.
  Render a screen with ?s=1..5 (see render-screens.sh).
-->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,"SF Pro Text",Helvetica,Arial,sans-serif}
body{width:390px;height:844px;background:#fff;color:#1d1d1f;overflow:hidden;position:relative}
.status{height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:15px;font-weight:600}
.nav{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.nav h1{font-size:22px;font-weight:700}
.icon{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#444}
.search{margin:6px 16px 12px;background:#f2f2f4;border-radius:12px;padding:11px 14px;color:#8a8a8e;font-size:15px}
.chips{display:flex;gap:8px;padding:0 16px 12px}
.chip{padding:7px 12px;border-radius:16px;background:#f2f2f4;font-size:13px}
.chip.on{background:#2f7d4f;color:#fff}
.card{margin:0 16px 14px;border-radius:16px;overflow:hidden;border:1px solid #ececf0}
.img{height:150px;display:flex;align-items:center;justify-content:center;font-size:56px}
.meta{padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.meta b{font-size:16px}.meta small{display:block;color:#8a8a8e;font-size:12px;margin-top:2px}
.tabbar{position:absolute;bottom:0;left:0;right:0;height:84px;border-top:1px solid #ececf0;display:flex;justify-content:space-around;padding-top:10px;font-size:11px;color:#8a8a8e;background:#fff}
.tabbar div{text-align:center}.tabbar span{display:block;font-size:20px;margin-bottom:2px}
.tabbar .on{color:#2f7d4f}
.hero{height:280px;background:linear-gradient(135deg,#f6d365,#fda085);display:flex;align-items:center;justify-content:center;font-size:110px;position:relative}
.hero .top{position:absolute;top:44px;left:0;right:0;display:flex;justify-content:space-between;padding:0 14px}
.hero .top .icon{background:rgba(255,255,255,.9)}
.body{padding:16px}
.body h2{font-size:24px;font-weight:700;line-height:1.2}
.row{display:flex;gap:14px;color:#6e6e73;font-size:13px;margin:8px 0 14px}
.btn{background:#2f7d4f;color:#fff;border-radius:12px;padding:14px;text-align:center;font-weight:600;font-size:16px}
.btn2{border:1px solid #d2d2d7;border-radius:12px;padding:13px;text-align:center;font-weight:600;font-size:15px;color:#1d1d1f;margin-top:10px}
.sec{font-weight:700;font-size:17px;margin:18px 0 8px}
.ing{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f2f2f4;font-size:15px}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.38)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;padding:10px 16px 34px}
.grab{width:40px;height:5px;border-radius:3px;background:#d2d2d7;margin:0 auto 12px}
.sheet h3{font-size:18px;font-weight:700;margin-bottom:4px}
.sheet p{color:#6e6e73;font-size:13px;margin-bottom:12px}
.coll{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f2f2f4}
.thumb{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px}
.coll div.t{flex:1}.coll b{font-size:15px;font-weight:600}.coll small{display:block;color:#8a8a8e;font-size:12px}
.check{width:24px;height:24px;border-radius:12px;border:2px solid #c7c7cc}
.check.on{background:#2f7d4f;border-color:#2f7d4f;color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center}
.newc{color:#2f7d4f;font-weight:600;padding:12px 0;font-size:15px}
.tabs{display:flex;gap:22px;padding:6px 16px 0;border-bottom:1px solid #ececf0;font-size:15px}
.tabs div{padding-bottom:10px;color:#8a8a8e}.tabs .on{color:#1d1d1f;border-bottom:2px solid #1d1d1f;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 16px}
.tile{border-radius:14px;overflow:hidden;border:1px solid #ececf0}
.tile .img{height:110px;font-size:40px}.tile .meta{padding:8px 10px}.tile b{font-size:14px}
.avatar{width:64px;height:64px;border-radius:32px;background:#e8f1ec;display:flex;align-items:center;justify-content:center;font-size:26px;color:#2f7d4f;font-weight:700}
.prof{display:flex;gap:14px;align-items:center;padding:6px 16px 14px}
.prof b{font-size:18px}.prof small{display:block;color:#8a8a8e;font-size:13px}
.modal{position:absolute;left:24px;right:24px;top:230px;background:#fff;border-radius:16px;padding:18px}
.modal h3{font-size:18px;font-weight:700;margin-bottom:12px}
.input{border:1.5px solid #2f7d4f;border-radius:10px;padding:12px;font-size:15px;color:#1d1d1f}
.toggle{display:flex;justify-content:space-between;align-items:center;margin:14px 0;font-size:14px}
.sw{width:46px;height:28px;border-radius:14px;background:#e5e5ea;position:relative}.sw::after{content:"";position:absolute;width:24px;height:24px;border-radius:12px;background:#fff;top:2px;left:2px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.mrow{display:flex;gap:10px;margin-top:6px}.mrow div{flex:1}
</style></head><body>
<div id="app"></div>
<script>
const s = new URLSearchParams(location.search).get("s") || "1";
const status = `<div class="status"><span>9:41</span><span>●●● ▮</span></div>`;
const tabbar = (on) => `<div class="tabbar">${[["⌂","Home"],["⌕","Search"],["＋","Plan"],["♡","Saved"],["◯","Profile"]].map(([i,l])=>`<div class="${l===on?"on":""}"><span>${i}</span>${l}</div>`).join("")}</div>`;
const card = (emoji, bg, title, sub) => `<div class="card"><div class="img" style="background:${bg}">${emoji}</div><div class="meta"><div><b>${title}</b><small>${sub}</small></div><div class="icon">♡</div></div></div>`;
const screens = {
 "1": `${status}<div class="nav"><h1>Pantry Pal</h1><div class="icon">🔔</div></div>
   <div class="search">Search recipes or ingredients</div>
   <div class="chips"><div class="chip on">For you</div><div class="chip">Quick</div><div class="chip">Vegetarian</div><div class="chip">Budget</div></div>
   ${card("🥗","linear-gradient(135deg,#f6d365,#fda085)","Lemon Herb Chickpea Bowl","25 min · 4.6 ★ (212)")}
   ${card("🍝","linear-gradient(135deg,#a1c4fd,#c2e9fb)","One-Pot Tomato Orzo","30 min · 4.8 ★ (530)")}
   ${tabbar("Home")}`,
 "2": `<div class="hero">🥗<div class="top"><div class="icon">‹</div><div style="display:flex;gap:8px"><div class="icon">⤴</div><div class="icon">⋯</div></div></div></div>
   <div class="body"><h2>Lemon Herb Chickpea Bowl</h2>
   <div class="row"><span>⏱ 25 min</span><span>👤 2 servings</span><span>★ 4.6 (212)</span></div>
   <div class="btn">Start cooking</div><div class="btn2">♡ Save</div>
   <div class="sec">Ingredients</div>
   <div class="ing"><span>Chickpeas, drained</span><span>1 can</span></div>
   <div class="ing"><span>Lemon</span><span>1</span></div>
   <div class="ing"><span>Fresh parsley</span><span>1 handful</span></div>
   <div class="ing"><span>Cooked quinoa</span><span>1 cup</span></div></div>`,
 "3": `<div class="hero">🥗</div><div class="body"><h2>Lemon Herb Chickpea Bowl</h2></div><div class="dim"></div>
   <div class="sheet"><div class="grab"></div><h3>Saved ♡</h3><p>Also add to a collection?</p>
   <div class="coll"><div class="thumb" style="background:#fde2c8">🍲</div><div class="t"><b>Weeknight dinners</b><small>14 recipes</small></div><div class="check"></div></div>
   <div class="coll"><div class="thumb" style="background:#d8ecff">🥡</div><div class="t"><b>Meal prep</b><small>6 recipes</small></div><div class="check on">✓</div></div>
   <div class="coll"><div class="thumb" style="background:#e8f1ec">🎉</div><div class="t"><b>Hosting</b><small>3 recipes · shared with household</small></div><div class="check"></div></div>
   <div class="newc">＋ New collection</div><div class="btn">Done</div></div>`,
 "4": `${status}<div class="prof"><div class="avatar">JD</div><div><b>Jordan D.</b><small>Home cook · 41 saved recipes</small></div></div>
   <div class="tabs"><div>Activity</div><div class="on">Collections</div><div>Reviews</div></div>
   <div class="grid">
   <div class="tile"><div class="img" style="background:#fde2c8">🍲</div><div class="meta"><div><b>Weeknight dinners</b><small>14 recipes</small></div></div></div>
   <div class="tile"><div class="img" style="background:#d8ecff">🥡</div><div class="meta"><div><b>Meal prep</b><small>7 recipes</small></div></div></div>
   <div class="tile"><div class="img" style="background:#e8f1ec">🎉</div><div class="meta"><div><b>Hosting</b><small>3 · shared</small></div></div></div>
   <div class="tile"><div class="img" style="background:#f2f2f4;color:#8a8a8e">♡</div><div class="meta"><div><b>All saved</b><small>41 recipes</small></div></div></div>
   </div>${tabbar("Profile")}`,
 "5": `<div class="hero">🥗</div><div class="body"><h2>Lemon Herb Chickpea Bowl</h2></div><div class="dim"></div>
   <div class="modal"><h3>New collection</h3><div class="input">Lunches|</div>
   <div class="toggle"><span>Share with household</span><div class="sw"></div></div>
   <div class="mrow"><div class="btn2" style="margin:0">Cancel</div><div class="btn" style="padding:13px">Create</div></div></div>`,
};
document.getElementById("app").innerHTML = screens[s];
</script></body></html>
